[Unit]
Description=thrdlabapp verified Docker Hub image
After=docker.service network-online.target
Requires=docker.service
Wants=network-online.target

[Service]
Environment=
Environment=PATH=/usr/local/bin:/usr/bin:/bin
SupplementaryGroups=docker
ExecStart=
ExecStart=/usr/bin/docker compose --project-name thrdlabapp-lan --env-file @PROJECT_DIR@/.deployment/active.env -f @PROJECT_DIR@/.deployment/active.compose.yaml up --no-build --pull never --exit-code-from web web
ExecStop=
ExecStop=/usr/bin/docker compose --project-name thrdlabapp-lan --env-file @PROJECT_DIR@/.deployment/active.env -f @PROJECT_DIR@/.deployment/active.compose.yaml stop --timeout 30 web
Restart=on-failure
RestartSec=5
TimeoutStopSec=45
