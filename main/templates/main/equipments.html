{% extends 'main/layout_furnaces.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="features">
        <h1>Equipment List:</h1>
<table>

    <tbody>
    <tr>
        <th>Laboratory</th>
        <th>Equipment</th>
    </tr>
    {% for equipment in equipments %}
    <tr>
        <td>&nbsp;&nbsp;{{ equipment.location }}&nbsp;&nbsp;</td>
        <td>&nbsp;&nbsp;
            <a href="{% url 'equipment'%}?equipment={{equipment.name}}">{{equipment.name}}</a>
            &nbsp;&nbsp;
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
    </div>
{% endblock %}
