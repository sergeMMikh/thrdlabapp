name: Django Testing and Deploy

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: electrochemistry_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d electrochemistry_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check updates
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup libs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting of code
        run: python -m flake8

      - name: Testing
        env:
          PGDATABASE: electrochemistry_lab
          PGUSER: postgres
          PGPASSWORD: vrag
          PGHOST: localhost
          PGPORT: 5432
        run: python -m pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/thrdlabapp
            git pull origin main
