name: Django Testing

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check updates
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup libs
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear flake8-builtins flake8-commas pep8-naming flake8-variables-names

      - name: Linting of code
        run: python -m flake8

  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: electrochemistry_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d electrochemistry_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check updates
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup libs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testing
        env:
          PGDATABASE: electrochemistry_lab
          PGUSER: postgres
          PGPASSWORD: vrag
          PGHOST: localhost
          PGPORT: 5432
        run: python -m pytest -q
